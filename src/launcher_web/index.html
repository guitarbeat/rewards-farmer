<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Rewards Farmer</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<div class="accent-bar" aria-hidden="true"></div>
	<main class="shell">
		<section class="hero card" aria-labelledby="brand-title">
			<div class="hero-accent" aria-hidden="true"></div>
			<div class="hero-body">
				<header class="hero-header">
					<div class="brand-mark" aria-hidden="true">RF</div>
					<div class="brand-copy">
						<h1 id="brand-title">Rewards Farmer</h1>
						<p id="subtitle" class="subtitle">One-click MS Rewards runs with your saved Edge profile.</p>
						<p id="setup-chip" class="chip">Loading…</p>
					</div>
				</header>
				<div class="actions">
					<div class="actions-primary">
						<button type="button" id="run-btn" class="btn btn-primary">Run</button>
						<button type="button" id="stop-btn" class="btn btn-stop" disabled>Stop</button>
					</div>
					<div class="actions-secondary">
						<button type="button" id="open-logs-btn" class="btn btn-ghost">Open logs</button>
						<button type="button" id="open-profile-btn" class="btn btn-ghost">Open profile</button>
						<button type="button" id="clear-log-btn" class="btn btn-ghost">Clear log</button>
					</div>
				</div>
			</div>
		</section>

		<section class="progress-block" aria-labelledby="progress-heading">
			<div class="section-head">
				<h2 id="progress-heading" class="section-label">Run progress</h2>
				<span id="progress-summary" class="pill">—</span>
			</div>
			<div id="progress-grid" class="progress-grid card"></div>
		</section>

		<section class="history-block" aria-labelledby="history-heading">
			<div class="section-head">
				<h2 id="history-heading" class="section-label">Past runs</h2>
				<span id="history-count" class="pill">0</span>
			</div>
			<div id="history-list" class="history-list card" role="list"></div>
		</section>

		<section class="log-block" aria-labelledby="log-heading">
			<div class="section-head">
				<h2 id="log-heading" class="section-label">Detailed log</h2>
				<button type="button" id="log-toggle" class="btn btn-ghost btn-compact">Show</button>
			</div>
			<div id="log-panel" class="log-panel card is-collapsed" hidden>
				<pre id="log-view" class="log-view" aria-live="polite"></pre>
			</div>
		</section>

		<footer class="status-bar card">
			<span id="status-dot" class="status-dot tone-idle" aria-hidden="true"></span>
			<span id="status-text">Ready to run</span>
			<span id="run-count" class="pill">0 runs</span>
		</footer>
	</main>

	<dialog id="alert-dialog">
		<form method="dialog" class="dialog-body">
			<p id="alert-message"></p>
			<button type="submit" class="btn btn-primary">OK</button>
		</form>
	</dialog>

	<script src="app.js"></script>
</body>
</html>
